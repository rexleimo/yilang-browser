name: release-build

# 生产环境包构建：
# - Android: 正式签名 APK（依赖仓库 Secrets 里的 keystore；未配置时回退 debug 签名）
# - iOS:     配置了签名 Secrets 时输出可分发的签名 .ipa（蒲公英用）；
#            未配置时输出未签名 .ipa（仅验证编译，不能装到设备）。
#
# 触发：手动（workflow_dispatch）或推送 v* 标签。
# 产物在 Actions run 页面的 Artifacts 区下载。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Android APK (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # 按架构拆包：通用包内含 3 份引擎/运行时（~57MB），arm64 单架构
      # 可降到 ~20MB；Release 只挂 arm64（现代真机全覆盖）。
      - name: Build APK (release, debug-signed, split per ABI)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: yilan-android-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*release*.apk
          if-no-files-found: error

      # Firebase 内测自动分发（可选）：仓库配置 FIREBASE_SERVICE_ACCOUNT_JSON
      # Secret 后自动生效，未配置时本步骤自动跳过。
      # 测试员组：Firebase 控制台 → App Distribution → 测试人员和组 → 建一个 "testers" 组。
      - name: Detect Firebase secret
        id: firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload APK to Firebase App Distribution
        if: ${{ steps.firebase.outputs.ready == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:180204699176:android:c3d24f005719f2b54fbf1d
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  build-ios:
    name: iOS IPA (release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # 签名材料（蒲公英分发必需）：
      #   IOS_P12_BASE64 / IOS_P12_PASSWORD     —— Apple 分布证书 (.p12)
      #   IOS_MOBILEPROVISION_BASE64            —— Ad Hoc 描述文件 (.mobileprovision)
      #   IOS_TEAM_ID                           —— Apple 开发者 Team ID
      - name: Detect signing secrets
        id: signing
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          MOBILEPROVISION: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$MOBILEPROVISION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import certificate & profile
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          MOBILEPROVISION: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci-keychain "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p ci-keychain "$KEYCHAIN_PATH"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k ci-keychain "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$MOBILEPROVISION" | base64 -d \
            > "$PP_DIR/yilan_adhoc.mobileprovision"

      - name: Write ExportOptions.plist
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Build IPA (signed, for pgyer)
        if: ${{ steps.signing.outputs.ready == 'true' }}
        run: >
          flutter build ipa --release
          --export-options-plist=ios/ExportOptions.plist

      - name: Build IPA (unsigned fallback)
        if: ${{ steps.signing.outputs.ready != 'true' }}
        run: flutter build ipa --release --no-codesign

      # --no-codesign 只产出 .xcarchive 不导出 .ipa：手工把 .app 打包成
      # 未签名 ipa（仅验证编译产物形态；蒲公英分发需要签名 ipa，走上方
      # 配置 Secrets 的签名路径）。
      - name: Package unsigned IPA
        if: ${{ steps.signing.outputs.ready != 'true' }}
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app \
            build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa && zip -qry app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: yilan-ios-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # Firebase 内测自动分发（可选）：仅签名 ipa 可装到设备，未签名包只归档不分发。
      - name: Detect Firebase secret (iOS)
        id: firebase_ios
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          ipa=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1 || true)
          if [ -n "$SA" ] && [ -n "$ipa" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Normalize IPA name
        if: ${{ steps.firebase_ios.outputs.ready == 'true' }}
        run: |
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          cp "$ipa" build/ios/ipa/firebase-dist.ipa

      - name: Upload IPA to Firebase App Distribution
        if: ${{ steps.firebase_ios.outputs.ready == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:180204699176:ios:ee3fa5a69c9d7a924fbf1d
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/ios/ipa/firebase-dist.ipa

      - name: Cleanup keychain
        if: ${{ always() && steps.signing.outputs.ready == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/yilan_adhoc.mobileprovision"

  # 打 tag 时把两个包挂到 GitHub Release 页（Releases 页可直接下载）。
  release:
    name: Attach packages to GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yilan-android-${{ github.ref_name }}
          path: apk-out

      - name: Pick arm64 APK
        run: mv apk-out/*arm64-v8a*release*.apk yilan-browser-${{ github.ref_name }}.apk

      # 固定文件名副本：官网「下载 Android 版 APK」按钮直链
      # https://github.com/rexleimo/yilang-browser/releases/latest/download/yilan-browser-latest.apk
      # 永远指向最新 Release，无需随版本更新链接。
      - name: Fixed-name APK for stable download link
        run: cp yilan-browser-${{ github.ref_name }}.apk yilan-browser-latest.apk

      - uses: actions/download-artifact@v4
        with:
          name: yilan-ios-${{ github.ref_name }}
          path: ios-out

      - name: Rename IPA
        run: mv ios-out/*.ipa yilan-browser-${{ github.ref_name }}.ipa

      # 固定名副本：官网「iOS · 爱思助手自签安装」按钮直链
      # https://github.com/rexleimo/yilang-browser/releases/latest/download/yilan-browser-latest.ipa
      - name: Fixed-name IPA for stable download link
        run: cp yilan-browser-${{ github.ref_name }}.ipa yilan-browser-latest.ipa

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            yilan-browser-*.apk
            yilan-browser-*.ipa