<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="1">
      <stop offset="0" stop-color="#6a4cf5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6a4cf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#4353C4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4353C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B87FF"/>
      <stop offset="1" stop-color="#6a4cf5"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#0B0B14"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow2)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <!-- 书签墙：三枚半透明磁贴 + 一枚高亮磁贴 -->
  <g>
    <rect x="184" y="184" width="300" height="300" rx="72" fill="url(#accent)" filter="url(#soft)"/>
    <circle cx="334" cy="334" r="46" fill="#ffffff" opacity="0.92"/>
    <rect x="540" y="184" width="300" height="300" rx="72" fill="#ffffff" opacity="0.18"/>
    <rect x="184" y="540" width="300" height="300" rx="72" fill="#ffffff" opacity="0.18"/>
    <rect x="540" y="540" width="300" height="300" rx="72" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
