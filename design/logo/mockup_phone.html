<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>主屏模拟</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#090909;display:grid;place-items:center;height:840px;width:460px;font-family:'Noto Sans SC','PingFang SC',sans-serif}
  .phone{width:378px;height:800px;border-radius:52px;border:11px solid #1c1c22;background:#000;overflow:hidden;position:relative}
  .wall{position:absolute;inset:0;background:
    radial-gradient(120% 70% at 85% 8%, rgba(106,76,245,.55), transparent 60%),
    radial-gradient(110% 60% at 10% 90%, rgba(67,83,196,.5), transparent 60%),
    linear-gradient(160deg,#141a3f 0%,#0c0f26 55%,#0a0b18 100%)}
  .status{position:relative;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;color:#fff;font-size:13px;font-weight:600}
  .grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;padding:22px 26px 0}
  .app{display:flex;flex-direction:column;align-items:center;gap:7px}
  .app .ic{width:62px;height:62px;border-radius:50%;position:relative;overflow:hidden;background:url('appicon/adaptive_bg.png') center/cover;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .app .ic img{position:absolute;inset:0;width:100%;height:100%}
  .ph{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .app span{font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .dock{position:absolute;left:18px;right:18px;bottom:26px;height:96px;border-radius:30px;background:rgba(255,255,255,.10);backdrop-filter:blur(6px);display:flex;justify-content:space-around;align-items:center;padding:0 14px}
  .dot{position:absolute;left:50%;bottom:138px;transform:translateX(-50%);display:flex;gap:8px}
  .dot i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
  .dot i.on{background:#fff}
</style>
</head>
<body>
  <div class="phone">
    <div class="wall"></div>
    <div class="status"><span>12:30</span><span>▲ ▲ ▮</span></div>
    <div class="grid">
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#34c759,#0d8a3e)"></div><span>电话</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#5ac8fa,#1f7ae0)"></div><span>信息</span></div>
      <div class="app"><div class="ic"><img src="appicon/adaptive_fg.png"></div><span>一览</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#ffd60a,#e0860a)"></div><span>相册</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#8a8f98,#4d525b)"></div><span>设置</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#ff7a3d,#e0452a)"></div><span>音乐</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#bf5af2,#8e30c9)"></div><span>日历</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#30d5c8,#0e9f94)"></div><span>商店</span></div>
    </div>
    <div class="dot"><i class="on"></i><i></i><i></i></div>
    <div class="dock">
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#34c759,#0d8a3e)"></div><span>电话</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#5ac8fa,#1f7ae0)"></div><span>信息</span></div>
      <div class="app"><div class="ic"><img src="appicon/adaptive_fg.png"></div><span>一览</span></div>
      <div class="app"><div class="ic" style="background:linear-gradient(135deg,#8a8f98,#4d525b)"></div><span>相机</span></div>
    </div>
  </div>
</body>
</html>
